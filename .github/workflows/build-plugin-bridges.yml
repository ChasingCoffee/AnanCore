name: Build Plugin Bridges

# Builds the native audio-plugin host bridges for every shipping RID:
#   zeus-vst-bridge (VST3 + CLAP; vst3sdk and clap submodules)
#                                              win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64
#   zeus-au-bridge  (Audio Units)              osx-arm64 osx-x64
# Each leg uploads a `plugin-bridges-<rid>` artifact laid out as
# Zeus.Plugins.Host/runtimes/<rid>/native/ — download and commit it, the same
# way the WDSP binaries from build-native-libs.yml are refreshed. The job also
# builds the in-tree test plug-in and runs the native ABI tests against it
# (ctest), so a bridge that builds but cannot host fails here.

on:
  push:
    paths:
      - 'native/zeus-vst-bridge/**'
      - 'native/zeus-au-bridge/**'
      - 'tools/stage-plugin-bridges.sh'
      - 'tools/stage-windows-vst-bridge.ps1'
      - '.github/workflows/build-plugin-bridges.yml'
  pull_request:
    paths:
      - 'native/zeus-vst-bridge/**'
      - 'native/zeus-au-bridge/**'
      - 'tools/stage-plugin-bridges.sh'
      - 'tools/stage-windows-vst-bridge.ps1'
      - '.github/workflows/build-plugin-bridges.yml'
  workflow_dispatch:

jobs:
  bridges:
    name: Plugin bridges (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
            osx_arch: arm64
            can_run: true
          - rid: osx-x64
            os: macos-14
            osx_arch: x86_64
            can_run: false   # cross-built on Apple Silicon; no x64 execution
          # Oldest supported Ubuntu so the .so links against an old glibc.
          - rid: linux-x64
            os: ubuntu-22.04
            can_run: true
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            can_run: true
          - rid: win-x64
            os: windows-2022
            vs_arch: x64
            can_run: true
          - rid: win-arm64
            os: windows-2022
            vs_arch: ARM64
            can_run: false   # cross-built on x64

    steps:
      - uses: actions/checkout@v5

      - name: Init vst3sdk (hosting subset) + CLAP SDK submodules
        shell: bash
        run: |
          git submodule update --init native/zeus-vst-bridge/third_party/vst3sdk native/zeus-vst-bridge/third_party/clap
          git -C native/zeus-vst-bridge/third_party/vst3sdk submodule update --init base pluginterfaces public.sdk cmake

      - name: Install X11 headers (Linux editor hosting)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Build VST3 bridge + test plug-in (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DZEUS_VST_REQUIRE_SDK=ON)
          if [ "${{ runner.os }}" = macOS ]; then
            args+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }})
          fi
          cmake -S native/zeus-vst-bridge -B native/zeus-vst-bridge/build "${args[@]}"
          cmake --build native/zeus-vst-bridge/build --config Release --parallel

      - name: Build VST3 bridge + test plug-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native/zeus-vst-bridge -B native/zeus-vst-bridge/build -G "Visual Studio 17 2022" -A ${{ matrix.vs_arch }} -DZEUS_VST_REQUIRE_SDK=ON
          cmake --build native/zeus-vst-bridge/build --config Release --parallel

      - name: Build AU bridge (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S native/zeus-au-bridge -B native/zeus-au-bridge/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}
          cmake --build native/zeus-au-bridge/build --parallel

      - name: Stage into runtimes/${{ matrix.rid }}/native
        shell: bash
        run: |
          dest="Zeus.Plugins.Host/runtimes/${{ matrix.rid }}/native"
          rm -rf staged && mkdir -p "staged/$dest"
          case "${{ runner.os }}" in
            macOS)
              cp native/zeus-vst-bridge/build/libzeus-vst-bridge.dylib "staged/$dest/"
              cp native/zeus-vst-bridge/build/zeus-plugin-probe "staged/$dest/"
              cp native/zeus-au-bridge/build/libzeus-au-bridge.dylib "staged/$dest/" ;;
            Linux)
              cp native/zeus-vst-bridge/build/libzeus-vst-bridge.so native/zeus-vst-bridge/build/zeus-plugin-probe "staged/$dest/" ;;
            Windows)
              cp native/zeus-vst-bridge/build/Release/zeus-vst-bridge.dll native/zeus-vst-bridge/build/Release/zeus-plugin-probe.exe "staged/$dest/" ;;
          esac
          ls -la "staged/$dest"

      - name: Verify exported ABI
        shell: bash
        run: |
          dest="staged/Zeus.Plugins.Host/runtimes/${{ matrix.rid }}/native"
          want_vst="zvst_init zvst_load_vst3 zvst_process zvst_set_param zvst_unload zvst_shutdown zvst_describe zvst_editor_open zvst_editor_close zvst_editor_is_open zvst_get_latency_samples zvst_load_vst3_class zvst_get_state zvst_set_state zclap_init zclap_describe zclap_load zclap_process zclap_set_param zclap_unload zclap_get_latency_samples zclap_get_state zclap_set_state zclap_editor_open zclap_editor_close zclap_editor_is_open"
          case "${{ runner.os }}" in
            macOS)   syms=$(nm -gU "$dest/libzeus-vst-bridge.dylib"); aus=$(nm -gU "$dest/libzeus-au-bridge.dylib") ;;
            Linux)   syms=$(nm -D --defined-only "$dest/libzeus-vst-bridge.so") ;;
            Windows) syms=$(llvm-objdump -p "$dest/zeus-vst-bridge.dll" 2>/dev/null || objdump -p "$dest/zeus-vst-bridge.dll") ;;
          esac
          missing=0
          for s in $want_vst; do
            echo "$syms" | grep -q "$s" || { echo "MISSING $s"; missing=1; }
          done
          if [ "${{ runner.os }}" = macOS ]; then
            for s in zau_init zau_get_state zau_set_state zau_get_latency_samples; do
              echo "$aus" | grep -q "$s" || { echo "MISSING $s"; missing=1; }
            done
            otool -l "$dest/libzeus-vst-bridge.dylib" | grep -A3 LC_BUILD_VERSION | grep minos
          fi
          exit $missing

      # Native ABI tests (native/zeus-vst-bridge/tests) against the VST3 and
      # CLAP test plug-ins: load/process, class selection, state round-trip,
      # 64-bit-only plug-ins, latency, CLAP threading. Only where the runner
      # can execute the build.
      - name: Native bridge tests (ctest)
        if: matrix.can_run
        run: ctest --test-dir native/zeus-vst-bridge/build -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-bridges-${{ matrix.rid }}
          path: staged/
          if-no-files-found: error
