name: Build Plugin Bridges

# Builds the native audio-plugin host bridges for every shipping RID:
#   zeus-vst-bridge (VST3, vst3sdk submodule)  win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64
#   zeus-au-bridge  (Audio Units)              osx-arm64 osx-x64
# Each leg uploads a `plugin-bridges-<rid>` artifact laid out as
# Zeus.Plugins.Host/runtimes/<rid>/native/ — download and commit it, the same
# way the WDSP binaries from build-native-libs.yml are refreshed. The job also
# builds the in-tree test plug-in and loads it through the fresh bridge, so a
# bridge that builds but cannot host fails here.

on:
  push:
    paths:
      - 'native/zeus-vst-bridge/**'
      - 'native/zeus-au-bridge/**'
      - 'tools/stage-plugin-bridges.sh'
      - 'tools/stage-windows-vst-bridge.ps1'
      - '.github/workflows/build-plugin-bridges.yml'
  pull_request:
    paths:
      - 'native/zeus-vst-bridge/**'
      - 'native/zeus-au-bridge/**'
      - 'tools/stage-plugin-bridges.sh'
      - 'tools/stage-windows-vst-bridge.ps1'
      - '.github/workflows/build-plugin-bridges.yml'
  workflow_dispatch:

jobs:
  bridges:
    name: Plugin bridges (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
            osx_arch: arm64
            can_run: true
          - rid: osx-x64
            os: macos-14
            osx_arch: x86_64
            can_run: false   # cross-built on Apple Silicon; no x64 execution
          # Oldest supported Ubuntu so the .so links against an old glibc.
          - rid: linux-x64
            os: ubuntu-22.04
            can_run: true
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            can_run: true
          - rid: win-x64
            os: windows-2022
            vs_arch: x64
            can_run: true
          - rid: win-arm64
            os: windows-2022
            vs_arch: ARM64
            can_run: false   # cross-built on x64

    steps:
      - uses: actions/checkout@v5

      - name: Init vst3sdk submodule (hosting subset only)
        shell: bash
        run: |
          git submodule update --init native/zeus-vst-bridge/third_party/vst3sdk
          git -C native/zeus-vst-bridge/third_party/vst3sdk submodule update --init base pluginterfaces public.sdk cmake

      - name: Install X11 headers (Linux editor hosting)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Build VST3 bridge + test plug-in (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DZEUS_VST_REQUIRE_SDK=ON)
          if [ "${{ runner.os }}" = macOS ]; then
            args+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }})
          fi
          cmake -S native/zeus-vst-bridge -B native/zeus-vst-bridge/build "${args[@]}"
          cmake --build native/zeus-vst-bridge/build --config Release --parallel

      - name: Build VST3 bridge + test plug-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native/zeus-vst-bridge -B native/zeus-vst-bridge/build -G "Visual Studio 17 2022" -A ${{ matrix.vs_arch }} -DZEUS_VST_REQUIRE_SDK=ON
          cmake --build native/zeus-vst-bridge/build --config Release --parallel

      - name: Build AU bridge (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S native/zeus-au-bridge -B native/zeus-au-bridge/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}
          cmake --build native/zeus-au-bridge/build --parallel

      - name: Stage into runtimes/${{ matrix.rid }}/native
        shell: bash
        run: |
          dest="Zeus.Plugins.Host/runtimes/${{ matrix.rid }}/native"
          rm -rf staged && mkdir -p "staged/$dest"
          case "${{ runner.os }}" in
            macOS)
              cp native/zeus-vst-bridge/build/libzeus-vst-bridge.dylib "staged/$dest/"
              cp native/zeus-au-bridge/build/libzeus-au-bridge.dylib "staged/$dest/" ;;
            Linux)
              cp native/zeus-vst-bridge/build/libzeus-vst-bridge.so "staged/$dest/" ;;
            Windows)
              cp native/zeus-vst-bridge/build/Release/zeus-vst-bridge.dll "staged/$dest/" ;;
          esac
          ls -la "staged/$dest"

      - name: Verify exported ABI
        shell: bash
        run: |
          dest="staged/Zeus.Plugins.Host/runtimes/${{ matrix.rid }}/native"
          want_vst="zvst_init zvst_load_vst3 zvst_process zvst_set_param zvst_unload zvst_shutdown zvst_describe zvst_editor_open zvst_editor_close zvst_editor_is_open zvst_get_latency_samples"
          case "${{ runner.os }}" in
            macOS)   syms=$(nm -gU "$dest/libzeus-vst-bridge.dylib"); aus=$(nm -gU "$dest/libzeus-au-bridge.dylib") ;;
            Linux)   syms=$(nm -D --defined-only "$dest/libzeus-vst-bridge.so") ;;
            Windows) syms=$(llvm-objdump -p "$dest/zeus-vst-bridge.dll" 2>/dev/null || objdump -p "$dest/zeus-vst-bridge.dll") ;;
          esac
          missing=0
          for s in $want_vst; do
            echo "$syms" | grep -q "$s" || { echo "MISSING $s"; missing=1; }
          done
          if [ "${{ runner.os }}" = macOS ]; then
            echo "$aus" | grep -q zau_init || { echo "MISSING zau_init"; missing=1; }
            otool -l "$dest/libzeus-vst-bridge.dylib" | grep -A3 LC_BUILD_VERSION | grep minos
          fi
          exit $missing

      - name: Load the test plug-in through the bridge
        if: matrix.can_run
        shell: bash
        run: |
          cat > smoke.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include "zvst.h"
          int main(int argc, char** argv) {
            if (zvst_init(ZVST_ABI) != ZVST_OK) { puts("init failed"); return 1; }
            char json[4096]; int32_t len = 0;
            int s = zvst_describe(argv[1], json, sizeof json, &len);
            printf("describe=%d %s\n", s, json);
            if (s != ZVST_OK || !strstr(json, "Zeus Test Invert")) return 2;
            for (int ch = 1; ch <= 2; ch++) {
              zvst_handle_t h = 0;
              s = zvst_load_vst3(argv[1], ch, 48000, 256, &h);
              printf("load(ch=%d)=%d\n", ch, s);
              if (s != ZVST_OK) return 3;
              float in[512], out[512];
              for (int i = 0; i < 512; i++) in[i] = (float)(i % 256) / 256.0f - 0.5f;
              s = zvst_process(h, in, out, 256);
              if (s != ZVST_OK) { printf("process=%d\n", s); return 4; }
              for (int i = 0; i < ch * 256; i++)
                if (out[i] - in[i] > 1e-5f || in[i] - out[i] > 1e-5f) { printf("mismatch at %d\n", i); return 5; }
              zvst_unload(h);
            }
            zvst_shutdown();
            puts("ok");
            return 0;
          }
          EOF
          inc=native/zeus-vst-bridge/include
          plugin=native/zeus-vst-bridge/build/test-plugin/ZeusTestPlugin.vst3
          case "${{ runner.os }}" in
            macOS)
              clang smoke.c -I$inc -Lnative/zeus-vst-bridge/build -lzeus-vst-bridge \
                -Wl,-rpath,$PWD/native/zeus-vst-bridge/build -o smoke && ./smoke "$plugin" ;;
            Linux)
              gcc smoke.c -I$inc -Lnative/zeus-vst-bridge/build -lzeus-vst-bridge \
                -Wl,-rpath,$PWD/native/zeus-vst-bridge/build -o smoke && ./smoke "$plugin" ;;
            Windows)
              clang smoke.c -I$inc -Lnative/zeus-vst-bridge/build/Release -lzeus-vst-bridge -o smoke.exe
              cp native/zeus-vst-bridge/build/Release/zeus-vst-bridge.dll .
              ./smoke.exe "$plugin" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-bridges-${{ matrix.rid }}
          path: staged/
          if-no-files-found: error
